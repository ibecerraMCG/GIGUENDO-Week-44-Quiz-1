<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Week 44 Practice Quiz 1</title>

    <style>
        /* --- CSS Variables & Themes --- */
        :root {
            --transition-speed: 0.3s;
            --font-main: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            
            /* Default Feedback Colors (Fallback for custom themes) */
            --feedback-success-bg: #064e3b;
            --feedback-success-border: #059669;
            --feedback-success-text: #a7f3d0;
            --feedback-error-bg: #7f1d1d;
            --feedback-error-border: #dc2626;
            --feedback-error-text: #fecaca;
        }[data-theme="dark"] {
            --bg-body: #1e293b; --bg-card: #334155; --bg-header: #0f172a;
            --text-main: #f1f5f9; --text-muted: #94a3b8; --text-accent: #38bdf8;
            --border-color: #475569; --highlight-bg: #475569;
            --button-bg: #38bdf8; --button-text: #0f172a; --button-hover: #0ea5e9;
        }[data-theme="light"] {
            --bg-body: #f3f4f6; --bg-card: #ffffff; --bg-header: #ffffff;
            --text-main: #1f2937; --text-muted: #6b7280; --text-accent: #2563eb;
            --border-color: #e5e7eb; --highlight-bg: #f3f4f6;
            --button-bg: #2563eb; --button-text: #ffffff; --button-hover: #1d4ed8;
            --feedback-success-bg: #ecfdf5; --feedback-success-border: #34d399; --feedback-success-text: #065f46;
            --feedback-error-bg: #fef2f2; --feedback-error-border: #f87171; --feedback-error-text: #991b1b;
        }[data-theme="midnight"] {
            --bg-body: #000000; --bg-card: #000000; --bg-header: #000000;
            --text-main: #e0e0e0; --text-muted: #888888; --text-accent: #90caf9;
            --border-color: #333333; --highlight-bg: #1a1a1a;
            --button-bg: #90caf9; --button-text: #000000; --button-hover: #42a5f5;
            --feedback-success-bg: #051b11; --feedback-success-border: #0f5132; --feedback-success-text: #75b798;
            --feedback-error-bg: #2c0b0e; --feedback-error-border: #842029; --feedback-error-text: #ea868f;
        }[data-theme="legacy-dark"] {
            --bg-body: #2d343e; --bg-card: #3c424f; --bg-header: #3c424f;
            --text-main: #e8e6e3; --text-muted: #b0c4de; --text-accent: #8ab4f8;
            --border-color: #555; --highlight-bg: #454c5a;
            --button-bg: #8ab4f8; --button-text: #202124; --button-hover: #a3c5f9;
            --feedback-success-bg: #344e41; --feedback-success-border: #52b788; --feedback-success-text: #c7f9cc;
            --feedback-error-bg: #5e2129; --feedback-error-border: #a4133c; --feedback-error-text: #f8d7da;
        }[data-theme="sepia"] {
            --bg-body: #f4ecd8; --bg-card: #fdf6e3; --bg-header: #e4d5b7;
            --text-main: #433422; --text-muted: #7c6f5a; --text-accent: #a05a2c;
            --border-color: #d3c4a5; --highlight-bg: #ebe1c9;
            --button-bg: #a05a2c; --button-text: #fdf6e3; --button-hover: #864822;
            --feedback-success-bg: #e6f4ea; --feedback-success-border: #8ab893; --feedback-success-text: #2e4c35;
            --feedback-error-bg: #f9e3e3; --feedback-error-border: #d48f8f; --feedback-error-text: #5c2b2b;
        }

        [data-theme="contrast"] {
            --bg-body: #000000; --bg-card: #000000; --bg-header: #000000;
            --text-main: #ffffff; --text-muted: #dddddd; --text-accent: #ffff00;
            --border-color: #ffffff; --highlight-bg: #333333;
            --button-bg: #ffff00; --button-text: #000000; --button-hover: #e6e600;
            --feedback-success-bg: #000000; --feedback-success-border: #00ff00; --feedback-success-text: #00ff00;
            --feedback-error-bg: #000000; --feedback-error-border: #ff0000; --feedback-error-text: #ff0000;
        }

        /* --- Global Reset & Layout --- */
        * { box-sizing: border-box; }
        
        body {
            font-family: var(--font-main);
            margin: 0;
            background-color: var(--bg-body);
            color: var(--text-main);
            transition: background-color var(--transition-speed), color var(--transition-speed);
            line-height: 1.6;
        }

        /* --- Header --- */
        header {
            background-color: var(--bg-header);
            border-bottom: 1px solid var(--border-color);
            padding: 1rem 2rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
        }

        header.unpinned { position: relative; box-shadow: none; }

        .header-top {
            display: flex; justify-content: space-between; align-items: center;
            width: 100%; flex-wrap: wrap; gap: 15px;
        }

        header h1 { font-size: 1.5rem; margin: 0; color: var(--text-accent); font-weight: 700; }

        .controls-wrapper { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }

        /* --- Custom Theme Builder --- */
        .custom-builder {
            display: none; flex-wrap: wrap; gap: 15px;
            background-color: var(--bg-card); padding: 10px 15px;
            border-radius: 8px; border: 1px solid var(--border-color);
            margin-top: 5px; font-size: 0.85rem; animation: fadeIn 0.3s;
            width: 100%; justify-content: flex-end;
        }
        .custom-builder.active { display: flex; }
        .color-picker-group { display: flex; align-items: center; gap: 8px; }
        .color-picker-group input[type="color"] {
            border: none; width: 25px; height: 25px; border-radius: 4px;
            cursor: pointer; padding: 0; background: none;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }

        /* --- Controls --- */
        .header-btn {
            background-color: var(--highlight-bg);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            transition: all 0.2s;
            height: 34px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .header-btn:hover {
            border-color: var(--text-accent);
            color: var(--text-accent);
        }

        .pin-btn {
            background: none; border: 1px solid var(--border-color); color: var(--text-main);
            cursor: pointer; padding: 0 10px; border-radius: 6px; font-size: 1rem;
            transition: background-color 0.2s; height: 34px; display: flex;
            align-items: center; justify-content: center;
        }
        .pin-btn:hover { background-color: var(--highlight-bg); }
        .pin-btn.pin-active { background-color: rgba(0, 0, 0, 0.1); }

        select#theme-select {
            padding: 0 12px; border-radius: 6px; border: 1px solid var(--border-color);
            background-color: var(--bg-card); color: var(--text-main);
            cursor: pointer; font-family: inherit; height: 34px;
        }

        /* --- Section Navigation --- */
        .section-nav { display: flex; gap: 10px; flex-wrap: wrap; }
        .section-nav button {
            background-color: var(--highlight-bg); color: var(--text-main);
            border: 1px solid var(--border-color); padding: 6px 12px;
            border-radius: 6px; cursor: pointer; font-size: 0.85rem;
            font-weight: 500; transition: all 0.2s;
        }
        .section-nav button:hover { border-color: var(--text-accent); color: var(--text-accent); }

        /* --- Main Content --- */
        .container {
            max-width: 850px;
            margin: 2rem auto;
            padding: 0 1rem 4rem 1rem;
        }

        .section-header {
            margin-top: 3rem;
            margin-bottom: 1.5rem;
            padding-bottom: 0.5rem;
            border-bottom: 2px solid var(--text-accent);
            color: var(--text-accent);
            font-size: 1.5rem;
            font-weight: 700;
            scroll-margin-top: 150px; /* Offset for sticky header */
        }

        /* --- Question Card --- */
        .question-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 2rem;
            margin-bottom: 2rem;
            box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1);
            transition: transform 0.2s ease;
        }

        .lo-box {
            background-color: var(--highlight-bg);
            border-left: 4px solid var(--text-accent);
            padding: 1rem;
            margin-bottom: 1.5rem;
            border-radius: 4px;
            font-size: 0.9rem;
            color: var(--text-muted);
            font-style: italic;
            display: none; /* Hidden by default */
        }

        .question-text {
            font-size: 1.15rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
        }

        /* --- Options --- */
        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .option-label {
            display: flex;
            align-items: flex-start;
            padding: 1rem;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .option-label:hover {
            background-color: var(--highlight-bg);
            border-color: var(--text-muted);
        }

        .option-label input {
            margin-top: 0.3rem;
            margin-right: 1rem;
            accent-color: var(--text-accent);
            transform: scale(1.2);
        }

        /* --- Buttons --- */
        .btn-check {
            margin-top: 1.5rem;
            background-color: var(--button-bg);
            color: var(--button-text);
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
            font-size: 1rem;
        }

        .btn-check:hover {
            opacity: 0.9;
        }

        .btn-link {
            display: inline-block;
            background-color: var(--button-bg);
            color: var(--button-text);
            text-decoration: none;
            padding: 0.75rem 1.5rem;
            border-radius: 6px;
            font-weight: 600;
            transition: opacity 0.2s;
            font-size: 1rem;
        }

        .btn-link:hover {
            opacity: 0.9;
        }

        /* --- Feedback Area --- */
        .feedback {
            margin-top: 1.5rem;
            padding: 1.5rem;
            border-radius: 8px;
            display: none; /* Hidden by default */
            border: 1px solid transparent;
            animation: slideDown 0.3s ease-out;
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .feedback.correct {
            background-color: var(--feedback-success-bg);
            border-color: var(--feedback-success-border);
            color: var(--feedback-success-text);
        }

        .feedback.incorrect {
            background-color: var(--feedback-error-bg);
            border-color: var(--feedback-error-border);
            color: var(--feedback-error-text);
        }

        .feedback-header {
            font-weight: 800;
            font-size: 1.1rem;
            margin-bottom: 0.5rem;
            display: block;
        }

        .rationale {
            margin-top: 1rem;
            font-size: 0.95rem;
        }

        .source {
            display: block;
            margin-top: 1rem;
            font-size: 0.85rem;
            opacity: 0.8;
            font-style: italic;
            border-top: 1px dashed currentColor;
            padding-top: 0.5rem;
        }

        /* --- Mobile Tweaks --- */
        @media (max-width: 768px) {
            .header-top { flex-direction: column; align-items: flex-start; }
            .controls-wrapper { width: 100%; justify-content: flex-start; }
            .section-nav { justify-content: flex-start; }
            .custom-builder { justify-content: flex-start; }
            header h1 { font-size: 1.25rem; }
            #reveal-all-container { justify-content: flex-start !important; }
        }
    </style>
</head>
<body>

    <header id="main-header">
        <div class="header-top">
            <h1>Week 44 Practice Quiz 1</h1>
            <div class="controls-wrapper">
                
                <!-- Reveal LOs Button -->
                <button id="reveal-all-btn" class="header-btn" onclick="toggleAllLOs()">Show Learning Objectives</button>
                
                <!-- Pin Button -->
                <button class="pin-btn pin-active" id="pin-btn" onclick="toggleHeader()" title="Pin/Unpin Header">📌</button>
                
                <!-- Theme Selector -->
                <div class="theme-control">
                    <select id="theme-select" onchange="changeTheme(this.value)">
                        <option value="dark">Modern Dark</option>
                        <option value="midnight">Midnight</option>
                        <option value="light">Modern Light</option>
                        <option value="legacy-dark">Legacy Dark</option>
                        <option value="sepia">Sepia</option>
                        <option value="contrast">High Contrast</option>
                        <option value="custom">⚙️ Custom...</option>
                    </select>
                </div>
            </div>
            
            <!-- Custom Theme Color Pickers -->
            <div class="custom-builder" id="custom-builder">
                <div class="color-picker-group">
                    <label>Background:</label>
                    <input type="color" id="color-bg" value="#1a1a2e" oninput="updateCustomTheme()">
                </div>
                <div class="color-picker-group">
                    <label>Cards:</label>
                    <input type="color" id="color-card" value="#16213e" oninput="updateCustomTheme()">
                </div>
                <div class="color-picker-group">
                    <label>Text:</label>
                    <input type="color" id="color-text" value="#e94560" oninput="updateCustomTheme()">
                </div>
                <div class="color-picker-group">
                    <label>Accent:</label>
                    <input type="color" id="color-accent" value="#0f3460" oninput="updateCustomTheme()">
                </div>
            </div>
        </div>
        
        <!-- Dynamic Navigation Bar -->
        <div class="section-nav" id="section-nav"></div>
    </header>

    <div class="container">
        <div id="quiz-root">
            <!-- Content injected via JS -->
        </div>
    </div>

    <script>
        // --- Data ---
        const quizData = [
            // --- Section 1: Complications of Pregnancy ---
            {
                section: "Complications of Pregnancy",
                fullLO: "LO1: Discuss spontaneous abortion",
                question: "An 8-week pregnant woman presents to the emergency department complaining of vaginal bleeding and mild uterine cramping. Ultrasound reveals no viable intrauterine pregnancy. The patient's blood type is O negative. To prevent alloimmunization, which of the following is the most appropriate pharmacological intervention?",
                options: {
                    A: "Ampicillin",
                    B: "Betamethasone",
                    C: "Magnesium sulfate",
                    D: "Misoprostol",
                    E: "RhD immune globulin"
                },
                correctAnswer: "E",
                rationale: "RhD-negative and unsensitized patients who experience a spontaneous abortion (early pregnancy loss) are typically treated with RhD immune globulin (RhoGam) to prevent alloimmunization.",
                source: "Complications of Pregnancy, slide 9: 'RhD-negative and unsensitized patients are typically treated with RhD immune globulin to prevent alloimmunization (RhoGam)'"
            },
            {
                section: "Complications of Pregnancy",
                fullLO: "LO1: Discuss spontaneous abortion",
                question: "A 28-year-old woman at 9 weeks gestation is diagnosed with an early pregnancy loss. Her ultrasound shows no cardiac activity, and she prefers medical management over expectant or surgical management. Which of the following medications is most appropriate to induce passage of the uterine contents?",
                options: {
                    A: "Indomethacin",
                    B: "Magnesium sulfate",
                    C: "Misoprostol",
                    D: "Nifedipine",
                    E: "Penicillin G"
                },
                correctAnswer: "C",
                rationale: "Medical management of a spontaneous abortion utilizes misoprostol (often with mifepristone) to induce passage of the uterine contents.",
                source: "Complications of Pregnancy, slide 7: 'Medical management: Misoprostol to induce passage of the uterine contents (+mifepristone)'"
            },
            {
                section: "Complications of Pregnancy",
                fullLO: "LO2: Discuss anemia complicating pregnancy",
                question: "A 26-year-old pregnant woman presents for a routine prenatal visit. A complete blood count reveals a hemoglobin concentration of 11.2 g/dL, which is lower than her pre-pregnancy baseline of 13.5 g/dL. Her mean corpuscular volume (MCV) and serum ferritin are within normal limits. The physician explains that this represents a physiologic (dilutional) anemia. Which of the following physiological processes best explains this patient's hematologic findings?",
                options: {
                    A: "Decreased overall red blood cell mass",
                    B: "Disproportionate expansion of maternal blood volume",
                    C: "Increased maternal folate requirements",
                    D: "Increased red blood cell destruction",
                    E: "Suppression of bone marrow production"
                },
                correctAnswer: "B",
                rationale: "Physiologic anemia of pregnancy is a dilutional anemia. It occurs because the maternal blood volume expands significantly, which dilutes the red blood cells, even though the overall red blood cell mass actually increases during pregnancy.",
                source: "Complications of Pregnancy, slide 11: 'Physiologic (dilutional) Physiologic changes during pregnancy result in dilutional anemia despite an overall increase in RBC mass... Iron requirements increase dramatically in pregnancy due to expanding maternal blood volume'"
            },
            {
                section: "Complications of Pregnancy",
                fullLO: "LO2: Discuss anemia complicating pregnancy",
                question: "A 32-year-old woman at 32 weeks gestation is diagnosed with severe iron-deficiency anemia. She was previously prescribed oral ferrous sulfate but developed intolerable gastrointestinal side effects and stopped taking it. Which of the following is the most appropriate next step in the management of her anemia?",

                    C: "Folic acid supplementation",
                    D: "Red blood cell transfusion",
                    E: "Switching to a different oral iron formulation"
                },
                correctAnswer: "A",
                rationale: "Intravenous iron is indicated for women who cannot tolerate oral iron, for severe anemia especially in later pregnancy (after 30 weeks gestational age), or when oral iron is not effective.",
                source: "Complications of Pregnancy, slide 13: 'Intravenous iron: For women who cannot tolerate oral iron... For severe anemia, especially later pregnancy (after 30 wga)'"
            },
            {
                section: "Complications of Pregnancy",
                fullLO: "LO3: Discuss gestational diabetes",
                question: "A 30-year-old pregnant woman is diagnosed with gestational diabetes at 26 weeks gestation. The pathogenesis of her condition involves significant insulin resistance mediated by the placenta. Which of the following placental hormones is primarily responsible for inducing this diabetogenic state?",
                options: {
                    A: "Estriol",
                    B: "Human chorionic gonadotropin",
                    C: "Oxytocin",
                    D: "Placental lactogen",
                    E: "Relaxin"
                },
                correctAnswer: "D",
                rationale: "Pregnancy is accompanied by insulin resistance mediated by placental secretion of diabetogenic hormones. These primarily include growth hormone, corticotropin-releasing hormone, placental lactogen (chorionic somatomammotropin), prolactin, and progesterone.",
                source: "Complications of Pregnancy, slide 14: 'Pregnancy is accompanied by insulin resistance, primarily mediated by placental secretion of diabetogenic hormones including... placental lactogen (chorionic somatomammotropin)'"
            },
            {
                section: "Complications of Pregnancy",
                fullLO: "LO3: Discuss gestational diabetes",
                question: "A 28-year-old pregnant woman undergoes universal screening for gestational diabetes at 25 weeks using the two-step approach. She completes a 50-gram one-hour glucose challenge test, and her result is abnormally elevated. Which of the following is the most appropriate next step in her diagnosis?",
                options: {
                    A: "75-gram, two-hour oral glucose tolerance test",
                    B: "100-gram, three-hour oral glucose tolerance test",
                    C: "Fasting blood glucose measurement",
                    D: "Hemoglobin A1C measurement",
                    E: "Initiation of insulin therapy"
                },
                correctAnswer: "B",
                rationale: "In the two-step approach for gestational diabetes diagnosis, screen-positive patients from the 50-gram one-hour challenge test go on to the second step, which is a 100-gram, three-hour oral glucose tolerance test (the diagnostic test).",
                source: "Complications of Pregnancy, slide 16: 'Two-step approach... Screen-positive patients go on to second step, a 100 gram, three-hour oral glucose tolerance test, which is the diagnostic test'"
            },
            {
                section: "Complications of Pregnancy",
                fullLO: "LO4: Discuss preterm labor/preterm rupture of membranes",
                question: "A 25-year-old woman at 31 weeks gestation presents with regular uterine contractions and cervical dilation of 3 cm. She is admitted for preterm labor. To protect the fetus from severe neurodevelopmental complications associated with premature birth, which of the following medications should be administered?",
                options: {
                    A: "Azithromycin",
                    B: "Betamethasone",
                    C: "Indomethacin",
                    D: "Magnesium sulfate",
                    E: "Penicillin G"
                },
                correctAnswer: "D",
                rationale: "In the initial treatment of preterm labor <34 weeks gestation, magnesium sulfate is administered specifically for fetal neuroprotection (if <32 weeks gestation). Betamethasone is given for fetal lung maturity.",
                source: "Complications of Pregnancy, slide 26: 'Initial treatment <34 weeks gestation... Magnesium sulfate for fetal neuroprotection (<32 weeks gestation)'"
            },
            {
                section: "Complications of Pregnancy",
                fullLO: "LO4: Discuss preterm labor/preterm rupture of membranes",
                question: "A 30-year-old pregnant woman at 32 weeks gestation presents with a sudden \"gush\" of clear fluid from her vagina. She denies any uterine contractions. A sterile speculum examination is performed, and the physician swabs the pooling fluid. Testing the fluid with Nitrazine paper reveals a pH of 7.2. This finding is most consistent with which of the following?",
                options: {
                    A: "Amniotic fluid",
                    B: "Bacterial vaginosis",
                    C: "Candidiasis",
                    D: "Normal vaginal secretions",
                    E: "Urine"
                },
                correctAnswer: "A",
                rationale: "The classical presentation of Preterm Prelabor Rupture of Membranes (PPROM) is a sudden gush of clear fluid. Nitrazine paper is used to test the pH; amniotic fluid has a pH range of 7.0 to 7.3, whereas normal vaginal pH is 3.8 to 4.2 and urine is typically <6.0.",

            },
            {
                section: "Complications of Pregnancy",
                fullLO: "LO5: Discuss the hypertensive disorders of pregnancy",
                question: "A 24-year-old nulliparous woman at 37 weeks gestation is found to have a blood pressure of 145/95 mmHg on two occasions. She has no history of elevated blood pressure prior to 20 weeks. Laboratory studies reveal a normal platelet count, normal liver enzymes, and negative urine protein. She denies headaches or visual changes. Which of the following is the most likely diagnosis?",

                    A: "Chronic hypertension",
                    B: "Eclampsia",

                    D: "HELLP syndrome",

                rationale: "Gestational hypertension is clinically diagnosed as the new onset of hypertension (BP ≥140/90 mmHg) at ≥20 weeks gestation in the strictly defined absence of proteinuria or new signs of end-organ dysfunction.",
                source: "Complications of Pregnancy, slide 34: 'Clinical diagnosis = new onset of hypertension (systolic blood pressure ≥140 mmHg and/or diastolic blood pressure ≥90 mmHg) at ≥20 weeks of gestation in the absence of proteinuria or new signs of end-organ dysfunction'"
            },
            {
                section: "Complications of Pregnancy",
                fullLO: "LO5: Discuss the hypertensive disorders of pregnancy",

                options: {
                    A: "Chronic hypertension with superimposed preeclampsia",
                    B: "Gestational hypertension",
                    C: "HELLP syndrome",

                    E: "Preeclampsia without severe features"
                },
                correctAnswer: "D",
                rationale: "Preeclampsia is characterized by new-onset hypertension and proteinuria. The presence of \"alarm findings\" such as severe blood pressure elevation (≥160/110 mmHg), severe persistent headache, or visual abnormalities (photophobia) indicates preeclampsia with severe features.",

            },
            {

                options: {

                    C: "Eclampsia",

                    E: "HELLP syndrome"

        // --- Core Logic ---
        const quizRoot = document.getElementById('quiz-root');
        const themeSelect = document.getElementById('theme-select');
        const pinBtn = document.getElementById('pin-btn');
        const mainHeader = document.getElementById('main-header');
        const sectionNav = document.getElementById('section-nav');
        const customBuilder = document.getElementById('custom-builder');
        const rootElements = document.documentElement;

        let isRevealed = false;

        function toggleAllLOs() {
            isRevealed = !isRevealed;
            const btn = document.getElementById('reveal-all-btn');
            btn.textContent = isRevealed ? "Hide Learning Objectives" : "Show Learning Objectives";
            
            document.querySelectorAll('.lo-box').forEach(box => {
                box.style.display = isRevealed ? 'block' : 'none';
            });
        }

        function initQuiz() {
            let currentSection = "";
            let sectionIndex = 0;
            
            quizData.forEach((item, index) => {
                if (item.section !== currentSection) {
                    currentSection = item.section;
                    
                    const sectionId = 'sec-' + sectionIndex;
                    
                    const sectionHeader = document.createElement('h2');
                    sectionHeader.className = 'section-header';
                    sectionHeader.id = sectionId;
                    sectionHeader.textContent = currentSection;
                    quizRoot.appendChild(sectionHeader);

                    const navBtn = document.createElement('button');
                    let btnText = currentSection;
                    if (btnText.includes("Complications of Pregnancy")) btnText = "Pregnancy Complications";
                    if (btnText.includes("Pathology of the Uterus and Ovaries")) btnText = "Uterus & Ovaries Pathology";
                    if (btnText.includes("Abnormal Uterine Bleeding")) btnText = "Abnormal Uterine Bleeding";
                    if (btnText.includes("Pelvic Pain")) btnText = "Pelvic Pain";
                    
                    navBtn.textContent = btnText;
                    navBtn.onclick = () => {
                        document.getElementById(sectionId).scrollIntoView({ behavior: 'smooth' });
                    };
                    sectionNav.appendChild(navBtn);

                    sectionIndex++;
                }

                const card = document.createElement('div');
                card.className = 'question-card';
                card.id = `q-card-${index}`;

                const loBox = document.createElement('div');
                loBox.className = 'lo-box';
                loBox.id = `lo-${index}`;
                loBox.innerHTML = item.fullLO;
                card.appendChild(loBox);

                const qText = document.createElement('div');
                qText.className = 'question-text';
                qText.innerHTML = `${index + 1}. ${item.question}`;
                card.appendChild(qText);

                const optionsGrid = document.createElement('div');
                optionsGrid.className = 'options-grid';

                for (const[key, value] of Object.entries(item.options)) {
                    const label = document.createElement('label');
                    label.className = 'option-label';
                    
                    const input = document.createElement('input');
                    input.type = 'radio';
                    input.name = `question-${index}`;
                    input.value = key;

                    const span = document.createElement('span');
                    span.innerHTML = `${key}. ${value}`;

                    label.appendChild(input);
                    label.appendChild(span);
                    optionsGrid.appendChild(label);
                }
                card.appendChild(optionsGrid);

                const btn = document.createElement('button');
                btn.className = 'btn-check';
                btn.textContent = 'Check Answer';
                btn.onclick = () => checkAnswer(index);
                card.appendChild(btn);

                const feedback = document.createElement('div');
                feedback.className = 'feedback';
                feedback.id = `feedback-${index}`;
                card.appendChild(feedback);

                quizRoot.appendChild(card);
            });

            const returnContainer = document.createElement('div');
            returnContainer.style.textAlign = 'center';
            returnContainer.style.marginTop = '2rem';
            
            const returnBtn = document.createElement('a');
            returnBtn.href = 'https://ibecerramcg.github.io/GI-GU-ENDO-Practice-Quizzes/';
            returnBtn.className = 'btn-link';
            returnBtn.textContent = '← Return to Quiz Directory';
            
            returnContainer.appendChild(returnBtn);
            quizRoot.appendChild(returnContainer);

            const savedTheme = localStorage.getItem('quizTheme') || 'dark';
            themeSelect.value = savedTheme;
            changeTheme(savedTheme);

            const savedPinState = localStorage.getItem('headerPinned');
            toggleHeader(savedPinState !== 'false');
        }

        function checkAnswer(index) {
            const selected = document.querySelector(`input[name="question-${index}"]:checked`);
            const feedbackEl = document.getElementById(`feedback-${index}`);
            const data = quizData[index];

            if (!selected) {
                alert("Please select an answer.");
                return;
            }

            const isCorrect = selected.value === data.correctAnswer;
            
            let html = `<span class="feedback-header">${isCorrect ? "Correct!" : "Incorrect"}</span>`;
            if (!isCorrect) {
                html += `<div>The correct answer is <strong>${data.correctAnswer}</strong>.</div>`;
            }
            
            html += `<div class="rationale"><strong>Rationale:</strong> ${data.rationale}</div>`;
            html += `<div class="source"><strong>Source:</strong> ${data.source}</div>`;

            feedbackEl.innerHTML = html;
            feedbackEl.className = `feedback ${isCorrect ? 'correct' : 'incorrect'}`;
            feedbackEl.style.display = 'block';
        }

        function changeTheme(themeName) {
            localStorage.setItem('quizTheme', themeName);
            
            if (themeName === 'custom') {
                rootElements.removeAttribute('data-theme');
                customBuilder.classList.add('active');
                loadCustomTheme();
            } else {
                rootElements.setAttribute('data-theme', themeName);
                customBuilder.classList.remove('active');
                rootElements.removeAttribute('style');
            }
        }

        function updateCustomTheme() {
            const bg = document.getElementById('color-bg').value;
            const card = document.getElementById('color-card').value;
            const text = document.getElementById('color-text').value;
            const accent = document.getElementById('color-accent').value;

            rootElements.style.setProperty('--bg-body', bg);
            rootElements.style.setProperty('--bg-header', bg);
            rootElements.style.setProperty('--bg-card', card);
            rootElements.style.setProperty('--highlight-bg', card);
            rootElements.style.setProperty('--text-main', text);
            rootElements.style.setProperty('--text-accent', accent);
            rootElements.style.setProperty('--button-bg', accent);
            rootElements.style.setProperty('--button-text', bg);
            rootElements.style.setProperty('--border-color', accent + '40');

            const customColors = { bg, card, text, accent };
            localStorage.setItem('customThemeColors', JSON.stringify(customColors));
        }

        function loadCustomTheme() {
            const savedColors = JSON.parse(localStorage.getItem('customThemeColors'));
            if (savedColors) {
                document.getElementById('color-bg').value = savedColors.bg;
                document.getElementById('color-card').value = savedColors.card;
                document.getElementById('color-text').value = savedColors.text;
                document.getElementById('color-accent').value = savedColors.accent;
                updateCustomTheme();
            } else {
                updateCustomTheme();
            }
        }

        function toggleHeader(forceState) {
            const isCurrentlyPinned = !mainHeader.classList.contains('unpinned');
            const newState = (typeof forceState === 'boolean') ? forceState : !isCurrentlyPinned;

            if (newState) {
                mainHeader.classList.remove('unpinned');
                pinBtn.classList.add('pin-active');
                localStorage.setItem('headerPinned', 'true');
            } else {
                mainHeader.classList.add('unpinned');
                pinBtn.classList.remove('pin-active');
                localStorage.setItem('headerPinned', 'false');
            }
        }

        document.addEventListener('DOMContentLoaded', initQuiz);

    </script>
</body>
</html>
